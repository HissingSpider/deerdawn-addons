# Build, sign and publish the registry to GitHub Pages (tools/build.js).
#
# On every push to main: pack each addons/<id>/<version>/ into
# dist/<id>-<version>.tgz, regenerate index.json, sign it with the Ed25519 key
# in the REGISTRY_SIGNING_KEY secret (PKCS8 PEM), check the signature against
# keys/registry-2026.pub.pem, and deploy _site/ to Pages. The site is entirely
# generated; nothing in it is committed.
#
# Needs: Settings -> Pages -> Source: "GitHub Actions", and the
# REGISTRY_SIGNING_KEY repository secret.

name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # generated_at and every published_at come from git history.
          fetch-depth: 0
          persist-credentials: false

      # Tarball bytes come from Node's zlib. They are the same on Node 20, 22
      # and 24 (tools/tests/build.test.js pins the first listing's sha256, so a
      # Node that changed them would fail here before anything is published).
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install tools
        working-directory: tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Tools tests
        working-directory: tools
        run: npm test

      - name: Build and sign
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: node tools/build.js --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
